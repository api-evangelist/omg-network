name: OMG Network
description: 'OMG Network (formerly OmiseGO) is a Layer-2 plasma scaling solution
  for Ethereum, providing faster, cheaper value transfer and settlement on top of
  the Ethereum root chain via a Watcher / child-chain architecture. Surfaced as a
  portfolio company of pantera-capital and added to the API Evangelist network. The
  project has largely wound down: the omg.network site currently resolves to a redirect
  loop and the first-party @omisego/omg-js SDK last published in 2022. Sector: crypto.'
